<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 행복북 서비스</title>

  <!-- 카카오맵 JavaScript SDK 불러오기 (services 라이브러리 포함) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=301c8e29ffe1b3d61f3cbc1302506b98&libraries=services"></script>

  <style>
    /* 기본 여백 및 박스 크기 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 전체 화면을 좌우 2분할로 나누는 컨테이너 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 사이드바 영역 */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #dee2e6;
      z-index: 10;
    }

    /* 카테고리 탭 버튼 영역 */
    .tab-container {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
    }

    .tab-button {
      flex: 1;
      padding: 14px 0;
      border: none;
      background-color: #f1f3f5;
      font-size: 15px;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background-color: #e9ecef;
    }

    /* 활성화된 탭 스타일 */
    .tab-button.active {
      background-color: #ffffff;
      color: #191919;
      border-bottom: 3px solid #fee500; /* 카카오 노란색 하단 포인트 */
    }

    /* 검색 입력창 영역 */
    .search-box {
      padding: 14px 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #fcc419;
    }

    .search-box button {
      padding: 10px 16px;
      background-color: #fee500;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #191919;
    }

    .search-box button:hover {
      background-color: #fada00;
    }

    /* 검색 결과 리스트 목록 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f3f5;
      cursor: pointer;
      background-color: #ffffff;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f1f3f5;
    }

    .result-item h4 {
      font-size: 15px;
      color: #212529;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-item p {
      font-size: 13px;
      color: #868e96;
      margin-bottom: 2px;
    }

    .result-item .phone-text {
      font-size: 12px;
      color: #2b8a3e;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 인포윈도우(팝업) 스타일 */
    .info-popup {
      padding: 12px;
      width: 240px;
      font-size: 13px;
      line-height: 1.5;
    }

    .info-popup h3 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #191919;
    }

    .info-popup .address {
      color: #495057;
      margin-bottom: 6px;
    }

    .info-popup .hours-info {
      background-color: #f8f9fa;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #495057;
      margin-bottom: 8px;
    }

    .info-popup a {
      display: inline-block;
      color: #1c7ed6;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }

    .info-popup a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 왼쪽 사이드바: 탭, 검색창, 결과 리스트 -->
    <aside class="sidebar">
      <!-- 카테고리 탭 버튼 -->
      <div class="tab-container">
        <button type="button" class="tab-button active" id="tabBookstore" onclick="switchCategory('bookstore')">📚 서점</button>
        <button type="button" class="tab-button" id="tabLibrary" onclick="switchCategory('library')">🏛️ 도서관</button>
      </div>

      <!-- 검색창 -->
      <form class="search-box" id="searchForm">
        <input type="text" id="keywordInput" placeholder="직접 장소를 검색하세요" required>
        <button type="submit">검색</button>
      </form>

      <!-- 결과 목록 -->
      <ul class="result-list" id="resultList">
        <!-- 검색 결과가 동적으로 입력됩니다 -->
      </ul>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main class="map-container">
      <div id="map"></div>
    </main>
  </div>

  <script>
    // 상태 및 지도 변수 선언
    let map = null;
    let placesService = null;
    let markers = [];
    let infoWindow = null;
    let currentCenter = null; // 사용자 현재 위치 좌표
    let currentCategory = 'bookstore'; // 현재 선택된 카테고리 기본값 ('bookstore' 또는 'library')

    // 마커 아이콘 색상 이미지 URL (카카오 기본 마커 색상 차용)
    const markerImageUrls = {
      bookstore: 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png', // 파란/노란 별표 아이콘
      library: 'https://t1.daumcdn.net/mapjsapi/images/2x/marker_red.png' // 빨간색 마커 아이콘
    };

    // 카카오 지도 SDK 로드 완료 후 실행
    kakao.maps.load(function () {
      initMap();
    });

    // 지도 초기화 함수
    function initMap() {
      const mapContainer = document.getElementById('map');
      
      // 기본 중심 좌표 (서울시청)
      const defaultLat = 37.566826;
      const defaultLng = 126.978656;
      currentCenter = new kakao.maps.LatLng(defaultLat, defaultLng);

      const mapOptions = {
        center: currentCenter,
        level: 5 // 지도 확대 레벨 5
      };

      map = new kakao.maps.Map(mapContainer, mapOptions);
      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 사용자 현재 위치 가져오기
      getCurrentLocation();

      // 직접 검색 폼 이벤트 리스너
      const searchForm = document.getElementById('searchForm');
      searchForm.addEventListener('submit', function (event) {
        event.preventDefault();
        searchCustomKeyword();
      });
    }

    // 현재 위치를 수신하고 초기 카테고리 검색 수행
    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            currentCenter = new kakao.maps.LatLng(currentLat, currentLng);

            // 지도 중심 이동
            map.setCenter(currentCenter);

            // 현재 카테고리 장소 자동 검색
            searchCategoryPlaces();
          },
          function (error) {
            console.warn('위치 권한을 얻지 못했습니다. 기본 위치(서울시청)를 기준으로 검색합니다.');
            searchCategoryPlaces();
          }
        );
      } else {
        alert('이 브라우저에서는 위치 서비스를 지원하지 않습니다.');
        searchCategoryPlaces();
      }
    }

    // 탭 변경 처리 함수
    function switchCategory(category) {
      if (currentCategory === category) return;

      currentCategory = category;

      // 탭 버튼 스타일 업데이트
      document.getElementById('tabBookstore').classList.toggle('active', category === 'bookstore');
      document.getElementById('tabLibrary').classList.toggle('active', category === 'library');

      // 기존 결과 및 마커 삭제 후 재검색
      clearMapAndList();
      searchCategoryPlaces();
    }

    // 현재 선택된 카테고리에 맞는 주변 장소 검색
    function searchCategoryPlaces() {
      const keyword = currentCategory === 'bookstore' ? '서점' : '도서관';

      // 현재 위치 주변 5km 이내 검색 옵션
      const searchOptions = {
        location: currentCenter,
        radius: 5000,
        sort: kakao.maps.services.SortBy.ACCURACY
      };

      placesService.keywordSearch(keyword, placesSearchCallback, searchOptions);
    }

    // 사용자 키워드 직접 검색
    function searchCustomKeyword() {
      const keywordInput = document.getElementById('keywordInput');
      const keyword = keywordInput.value.trim();

      if (!keyword) {
        alert('검색어를 입력해 주세요.');
        return;
      }

      clearMapAndList();
      placesService.keywordSearch(keyword, placesSearchCallback);
    }

    // 카카오 장소 검색 콜백 함수
    function placesSearchCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        displaySearchResults(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('주변에 해당 장소가 없습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 중 오류가 발생했습니다.');
      }
    }

    // 검색 결과 리스트 및 지도 마커 표시
    function displaySearchResults(places) {
      const resultList = document.getElementById('resultList');
      clearMapAndList();

      const bounds = new kakao.maps.LatLngBounds();

      // 카테고리별 마커 이미지 세팅
      const imageUrl = markerImageUrls[currentCategory] || markerImageUrls.bookstore;
      const imageSize = new kakao.maps.Size(27, 36);
      const markerImage = new kakao.maps.MarkerImage(imageUrl, imageSize);

      places.forEach(function (place) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 카테고리 색상이 적용된 마커 생성
        const marker = new kakao.maps.Marker({
          position: placePosition,
          map: map,
          image: markerImage
        });

        markers.push(marker);
        bounds.extend(placePosition);

        // 사이드바 결과 리스트 아이템 생성
        const listItem = document.createElement('li');
        listItem.className = 'result-item';
        listItem.innerHTML = `
          <h4>${place.place_name}</h4>
          <p>${place.road_address_name || place.address_name}</p>
          ${place.phone ? `<span class="phone-text">📞 ${place.phone}</span>` : ''}
        `;

        // 리스트 클릭 시 지도 이동 및 팝업 출력
        listItem.addEventListener('click', function () {
          map.panTo(placePosition);
          showInfoWindow(marker, place);
        });

        // 마커 클릭 시 팝업 출력
        kakao.maps.event.addListener(marker, 'click', function () {
          showInfoWindow(marker, place);
        });

        resultList.appendChild(listItem);
      });

      // 검색 결과 장소들이 모두 보이도록 영역 재설정
      map.setBounds(bounds);
    }

    // 마커 클릭 시 영업시간 및 휴무일 안내 팝업(인포윈도우) 표시
    function showInfoWindow(marker, place) {
      const address = place.road_address_name || place.address_name;
      const placeUrl = place.place_url; // 카카오맵 상세페이지 URL

      const popupContent = `
        <div class="info-popup">
          <h3>${place.place_name}</h3>
          <p class="address">📍 ${address}</p>
          <div class="hours-info">
            ⏱️ <strong>영업시간/휴무일</strong><br>
            상세 휴무일 및 운영시간은 아래 상세보기를 통해 확인하실 수 있습니다.
          </div>
          <a href="${placeUrl}" target="_blank">카카오맵 상세 정보 보기 &gt;</a>
        </div>
      `;

      infoWindow.setContent(popupContent);
      infoWindow.open(map, marker);
    }

    // 기존 마커, 리스트, 인포윈도우 초기화
    function clearMapAndList() {
      // 마커 삭제
      markers.forEach(function (marker) {
        marker.setMap(null);
      });
      markers = [];

      // 인포윈도우 닫기
      if (infoWindow) {
        infoWindow.close();
      }

      // 리스트 비우기
      const resultList = document.getElementById('resultList');
      if (resultList) {
        resultList.innerHTML = '';
      }
    }
  </script>
</body>
</html>
