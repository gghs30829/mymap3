<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>

  <!-- 카카오맵 JavaScript SDK 불러오기 (services 라이브러리 포함) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=301c8e29ffe1b3d61f3cbc1302506b98&libraries=services"></script>

  <style>
    /* 기본 여백 및 박스 크기 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 전체 화면을 좌우 2분할로 나누는 컨테이너 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 사이드바 영역 (검색창 + 검색결과) */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #dee2e6;
      z-index: 10;
    }

    /* 검색 입력창 영역 */
    .search-box {
      padding: 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #fcc419; /* 카카오 포인트 컬러 */
    }

    .search-box button {
      padding: 10px 16px;
      background-color: #fee500; /* 카카오 대표 노란색 */
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      color: #191919;
    }

    .search-box button:hover {
      background-color: #fada00;
    }

    /* 검색 결과 리스트 목록 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f3f5;
      cursor: pointer;
      background-color: #ffffff;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f1f3f5;
    }

    .result-item h4 {
      font-size: 15px;
      color: #212529;
      margin-bottom: 4px;
    }

    .result-item p {
      font-size: 13px;
      color: #868e96;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 왼쪽: 검색창 및 결과 리스트 -->
    <aside class="sidebar">
      <form class="search-box" id="searchForm">
        <input type="text" id="keywordInput" placeholder="장소를 검색하세요 (예: 강남역 카페)" required>
        <button type="submit">검색</button>
      </form>
      <ul class="result-list" id="resultList">
        <!-- 검색 결과가 여기에 동적으로 추가됩니다 -->
      </ul>
    </aside>

    <!-- 오른쪽: 지도 표시 영역 -->
    <main class="map-container">
      <div id="map"></div>
    </main>
  </div>

  <script>
    // 변수 선언
    let map = null;
    let placesService = null;
    let markers = [];
    let infoWindow = null;

    // 카카오 지도 SDK가 정상적으로 로드된 후 실행되도록 kakao.maps.load 사용
    kakao.maps.load(function () {
      initMap();
    });

    // 지도 및 초기 설정 함수
    function initMap() {
      const mapContainer = document.getElementById('map');
      
      // 기본 중심 좌표 (위치 권한 거부 시 사용할 기본 좌표: 서울시청)
      let initialLat = 37.566826;
      let initialLng = 126.978656;

      const mapOptions = {
        center: new kakao.maps.LatLng(initialLat, initialLng), // 지도 중심좌표
        level: 5 // 지도 확대 레벨 (요청 조건: 5)
      };

      // 지도 객체 생성
      map = new kakao.maps.Map(mapContainer, mapOptions);

      // 장소 검색 서비스 객체 생성 및 인포윈도우 생성
      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 사용자 현재 위치 가져오기 (Geolocation API)
      getCurrentLocation();

      // 검색 폼 이벤트 리스너 등록
      const searchForm = document.getElementById('searchForm');
      searchForm.addEventListener('submit', function (event) {
        event.preventDefault(); // 폼 제출 시 페이지 뒤로가기/새로고침 방지
        searchPlaces();
      });
    }

    // 현재 위치를 구해서 지도 중심을 이동하는 함수
    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            const currentPosition = new kakao.maps.LatLng(currentLat, currentLng);

            // 지도 중심을 현재 위치로 이동
            map.setCenter(currentPosition);

            // 현재 위치를 알리는 마커 추가
            const currentLocationMarker = new kakao.maps.Marker({
              map: map,
              position: currentPosition
            });
          },
          function (error) {
            console.warn('위치 권한을 얻지 못했습니다. 기본 위치로 표시합니다.');
          }
        );
      } else {
        alert('이 브라우저에서는 위치 서비스(Geolocation)를 지원하지 않습니다.');
      }
    }

    // 장소 검색 함수
    function searchPlaces() {
      const keywordInput = document.getElementById('keywordInput');
      const keyword = keywordInput.value.trim();

      if (!keyword) {
        alert('검색어를 입력해 주세요!');
        return;
      }

      // 카카오 키워드 검색 서비스 호출
      placesService.keywordSearch(keyword, placesSearchCB);
    }

    // 장소 검색 완료 시 호출되는 콜백 함수
    function placesSearchCB(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        // 검색 결과 목록 및 마커 표시
        displaySearchResults(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 중 오류가 발생했습니다.');
      }
    }

    // 검색 결과 및 마커를 화면에 출력하는 함수
    function displaySearchResults(places) {
      const resultList = document.getElementById('resultList');
      
      // 기존 마커 및 검색 결과 목록 제거
      clearMarkers();
      resultList.innerHTML = '';

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성 및 지도에 표시
        const marker = new kakao.maps.Marker({
          position: placePosition,
          map: map
        });

        markers.push(marker);
        bounds.extend(placePosition);

        // 검색 결과 리스트 아이템 생성
        const listItem = document.createElement('li');
        listItem.className = 'result-item';
        listItem.innerHTML = `
          <h4>${place.place_name}</h4>
          <p>${place.road_address_name || place.address_name}</p>
        `;

        // 리스트 클릭 이벤트: 해당 위치로 지도 이동 및 인포윈도우 표시
        listItem.addEventListener('click', function () {
          map.panTo(placePosition);
          showInfoWindow(marker, place.place_name);
        });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(marker, 'click', function () {
          showInfoWindow(marker, place.place_name);
        });

        resultList.appendChild(listItem);
      });

      // 검색된 모든 장소가 보이도록 지도 범위 조정
      map.setBounds(bounds);
    }

    // 인포윈도우(말풍선)를 지도에 표시하는 함수
    function showInfoWindow(marker, title) {
      const content = `<div style="padding:8px;font-size:12px;color:#333;">${title}</div>`;
      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 기존 마커들을 모두 지우는 함수
    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });
      markers = [];
    }
  </script>
</body>
</html>
