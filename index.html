<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 행복북 서비스</title>

  <!-- 카카오맵 JavaScript SDK 불러오기 (services 라이브러리 포함) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=301c8e29ffe1b3d61f3cbc1302506b98&libraries=services"></script>

  <style>
    /* 기본 여백 및 박스 크기 초기화 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 전체 화면을 좌우 2분할로 나누는 컨테이너 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 사이드바 영역 */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #dee2e6;
      z-index: 10;
    }

    /* 카테고리 탭 버튼 영역 */
    .tab-container {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
    }

    .tab-button {
      flex: 1;
      padding: 14px 0;
      border: none;
      background-color: #f1f3f5;
      font-size: 15px;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background-color: #e9ecef;
    }

    /* 활성화된 탭 스타일 */
    .tab-button.active {
      background-color: #ffffff;
      color: #191919;
      border-bottom: 3px solid #fee500; /* 카카오 노란색 하단 포인트 */
    }

    /* 검색 결과 리스트 목록 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f3f5;
      cursor: pointer;
      background-color: #ffffff;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f1f3f5;
    }

    .result-item h4 {
      font-size: 15px;
      color: #212529;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-item p {
      font-size: 13px;
      color: #868e96;
      margin-bottom: 2px;
    }

    .result-item .phone-text {
      font-size: 12px;
      color: #2b8a3e;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 인포윈도우(팝업) 스타일 */
    .info-popup {
      padding: 12px;
      width: 240px;
      font-size: 13px;
      line-height: 1.5;
    }

    .info-popup h3 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #191919;
    }

    .info-popup .address {
      color: #495057;
      margin-bottom: 6px;
    }

    .info-popup .hours-info {
      background-color: #f8f9fa;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #495057;
      margin-bottom: 8px;
    }

    .info-popup a {
      display: inline-block;
      color: #1c7ed6;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }

    .info-popup a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 왼쪽 사이드바: 탭, 결과 리스트 -->
    <aside class="sidebar">
      <!-- 카테고리 탭 버튼 -->
      <div class="tab-container">
        <button type="button" class="tab-button active" id="tabBookstore" onclick="switchCategory('bookstore')">📚 서점</button>
        <button type="button" class="tab-button" id="tabLibrary" onclick="switchCategory('library')">🏛️ 도서관</button>
      </div>

      <!-- 결과 목록 -->
      <ul class="result-list" id="resultList">
        <!-- 검색 결과가 동적으로 입력됩니다 -->
      </ul>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main class="map-container">
      <div id="map"></div>
    </main>
  </div>

  <script>
    //
